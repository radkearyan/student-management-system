version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=smart_sms_secure_secret_key_192837
      - SMTP_SERVER=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=your_email@gmail.com
      - SMTP_PASSWORD=your_app_password
    volumes:
      - ../backend/uploads:/app/backend/uploads
    restart: always

<!-- Shared Modal Components -->

<!-- MODAL: Change Password Form -->
<div id="change-pw-modal" class="modal-wrapper hidden">
    <div class="modal-card glassmorphism">
        <div class="modal-header">
            <h3>Change Account Password</h3>
            <button class="modal-close-btn" id="btn-close-change-modal">&times;</button>
        </div>
        <form id="change-password-form">
            <div class="form-group">
                <label for="change-current-pw">Current Password</label>
                <input type="password" id="change-current-pw" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label for="change-new-pw">New Password</label>
                <input type="password" id="change-new-pw" placeholder="••••••••" required>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="btn-cancel-change-modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Update Password</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL: Confirmation Action Dialog -->
<div id="confirm-action-modal" class="modal-wrapper hidden">
    <div class="modal-card glassmorphism" style="max-width: 440px; padding: 1.5rem; border-radius: 12px; text-align: center;">
        <div style="font-size: 2.5rem; color: var(--accent-gold); margin-bottom: 0.5rem;"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h3 id="confirm-modal-title" style="margin-bottom: 0.5rem; font-weight: 700; color: var(--text-main);">Confirm Action</h3>
        <p id="confirm-modal-message" style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.5rem;">Are you sure you want to perform this action?</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button type="button" class="btn btn-secondary btn-sm" id="btn-cancel-confirm">Cancel</button>
            <button type="button" class="btn btn-primary btn-sm" id="btn-proceed-confirm" style="background: var(--danger); border-color: var(--danger); color: white;">Yes, Proceed</button>
        </div>
    </div>
</div>

<!-- OVERLAY: Global Loading Spinner -->
<div id="global-loading-overlay" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 9999999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;">
    <div class="spinner" style="width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2); border-top-color: var(--accent-gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px;"></div>
    <span id="loading-overlay-text" style="font-weight: 600; font-size: 0.95rem;">Loading data...</span>
</div>

<style>
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>

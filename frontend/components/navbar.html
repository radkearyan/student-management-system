<div class="header-left" style="display: flex; align-items: center; gap: 14px;">
    <button id="mobile-menu-trigger" class="btn-icon" title="Toggle Navigation Menu" style="display: none; background: transparent; border: none; font-size: 1.25rem; color: var(--text-main); cursor: pointer;">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div>
        <h2 id="header-view-title" style="margin: 0; font-size: 1.15rem; font-weight: 700; color: var(--text-main);">Dashboard Overview</h2>
        <span id="header-view-subtitle" class="text-muted" style="font-size: 0.78rem;">Real-time educational insights & management portal</span>
    </div>
</div>

<!-- Global Search Box -->
<div class="global-search-wrapper" style="flex: 1; max-width: 380px; margin: 0 1rem; position: relative;">
    <div class="search-input-group" style="position: relative; display: flex; align-items: center;">
        <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; color: #64748b; font-size: 0.85rem; pointer-events: none;"></i>
        <input type="text" id="global-search-input" placeholder="Search students, faculty, subjects, announcements..." style="width: 100%; padding: 8px 12px 8px 36px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); font-size: 0.82rem; outline: none; transition: all 0.2s;" autocomplete="off">
        <span id="search-clear-btn" class="hidden" style="position: absolute; right: 12px; cursor: pointer; color: var(--text-muted); font-size: 0.8rem;">&times;</span>
    </div>
    
    <!-- Search Results Dropdown -->
    <div id="global-search-results" class="search-results-dropdown hidden" style="position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.25); z-index: 99999; max-height: 380px; overflow-y: auto; padding: 8px;">
        <div class="search-results-content"></div>
    </div>
</div>

<div class="header-right" style="display: flex; align-items: center; gap: 12px;">
    <!-- Notification Bell -->
    <div class="notification-container" style="position: relative;">
        <button id="notification-bell-btn" class="header-icon-btn" title="Campus Notifications" style="position: relative; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;">
            <i class="fa-solid fa-bell" style="font-size: 0.95rem;"></i>
            <span id="notification-badge" class="badge-count hidden" style="position: absolute; top: -4px; right: -4px; background: #ef4444; color: #fff; font-size: 0.65rem; font-weight: 700; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">0</span>
        </button>
        
        <!-- Notifications Dropdown -->
        <div id="notification-dropdown" class="notification-dropdown hidden" style="position: absolute; top: calc(100% + 8px); right: 0; width: 320px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 99999; padding: 12px;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 8px;">
                <h4 style="margin: 0; font-size: 0.88rem; font-weight: 700; color: var(--text-main);"><i class="fa-solid fa-bullhorn text-gold"></i> Notifications</h4>
                <span style="font-size: 0.72rem; color: var(--text-muted);">Real-time</span>
            </div>
            <div id="notification-items-list" style="max-height: 260px; overflow-y: auto;">
                <div class="text-muted" style="text-align: center; padding: 12px; font-size: 0.8rem;">Loading notifications...</div>
            </div>
        </div>
    </div>

    <!-- Theme Mode Toggler -->
    <div class="theme-toggle" id="theme-toggler" title="Toggle Light/Dark Theme Mode" style="background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: justify-center; justify-content: center; transition: all 0.2s;">
        <i class="fa-solid fa-moon" id="theme-toggler-icon" style="font-size: 0.95rem;"></i>
    </div>

    <!-- User Profile Dropdown Menu -->
    <div class="profile-dropdown-container" style="position: relative; z-index: 1001;">
        <div class="header-user-profile" id="header-user-profile" title="Click to open profile options" style="cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 4px 12px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; transition: all 0.2s;">
            <div class="user-avatar-small" id="header-user-avatar" style="width: 28px; height: 28px; border-radius: 50%; background: var(--accent-blue); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem;">A</div>
            <div style="display: flex; flex-direction: column; justify-content: center; line-height: 1.2;">
                <span id="header-user-username" style="font-weight: 600; font-size: 0.82rem; color: var(--text-main);">Admin</span>
                <span id="header-user-role-badge" style="font-size: 0.65rem; color: var(--accent-gold); font-weight: 600; text-transform: uppercase;">Admin</span>
            </div>
            <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem; color: var(--text-muted); margin-left: 2px;"></i>
        </div>

        <div id="profile-dropdown-menu" class="profile-dropdown-menu hidden" style="position: absolute; top: calc(100% + 8px); right: 0; width: 220px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.35); z-index: 999999; padding: 8px; display: flex; flex-direction: column; gap: 4px;">
            <!-- Profile Info Header -->
            <div style="padding: 6px 10px 10px 10px; border-bottom: 1px solid var(--border-color); margin-bottom: 4px;">
                <div id="dropdown-user-fullname" style="font-weight: 700; font-size: 0.88rem; color: var(--text-main);">Admin</div>
                <div id="dropdown-user-role" style="font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; text-transform: capitalize;">Administrator Account</div>
            </div>

            <a href="profile.html" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; color: var(--text-main); text-decoration: none; font-size: 0.82rem; transition: all 0.2s;" class="dropdown-item">
                <i class="fa-solid fa-id-badge" style="color: var(--accent-blue);"></i> My Profile
            </a>
            <a href="#" id="btn-navbar-change-pw" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; color: var(--text-main); text-decoration: none; font-size: 0.82rem; transition: all 0.2s;" class="dropdown-item">
                <i class="fa-solid fa-key" style="color: var(--accent-gold);"></i> Change Password
            </a>
            <div style="border-top: 1px solid var(--border-color); margin: 2px 0;"></div>
            <a href="#" id="btn-navbar-logout" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; color: #ef4444; text-decoration: none; font-size: 0.82rem; font-weight: 600; transition: all 0.2s;" class="dropdown-item">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
            </a>
        </div>
    </div>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Degree Courses Plan</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="dark-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation Container -->
        <aside class="sidebar glassmorphism" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header Container -->
            <header class="main-header glassmorphism" id="header-container"></header>

            <!-- Scrollable Content Body -->
            <div class="content-body">
                <section id="view-courses" class="dashboard-view">
                    <!-- Action Row -->
                    <div class="action-bar-row" style="display: flex; justify-content: space-between; align-items: center; gap: 1rem;">
                        <div class="search-box" style="display: flex; align-items: center; gap: 8px; flex: 1; max-width: 450px; background: rgba(0,0,0,0.15); border: 1px solid var(--glass-border); padding: 0.5rem 1rem; border-radius: 8px;">
                            <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
                            <input type="text" id="course-page-search" placeholder="Search courses by name or code..." style="background: transparent; border: none; outline: none; width: 100%; color: var(--text-main);">
                        </div>
                        <div class="filters-row" style="display: flex; gap: 0.75rem;">
                            <button class="btn btn-primary" id="btn-page-add-course">
                                <i class="fa-solid fa-plus"></i> Add New Degree Course Plan
                            </button>
                        </div>
                    </div>

                    <!-- Courses Cards Grid -->
                    <div id="courses-grid-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 1.5rem;">
                        <div class="empty-category-notice glassmorphism" style="grid-column: 1 / -1; padding: 2rem; text-align: center; color: var(--text-muted);">
                            <i class="fa-solid fa-spinner fa-spin" style="font-size: 1.5rem; margin-bottom: 0.5rem;"></i><br>Loading degree course plans...
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- MODAL: Add Course Plan -->
    <div id="page-course-modal" class="modal-wrapper hidden">
        <div class="modal-card glassmorphism">
            <div class="modal-header">
                <h3><i class="fa-solid fa-graduation-cap" style="color: var(--accent-gold);"></i> Create Degree Course Plan</h3>
                <button class="modal-close-btn" id="btn-close-page-course-modal">&times;</button>
            </div>
            <form id="page-course-form">
                <div class="form-group">
                    <label for="p-course-code"><i class="fa-solid fa-barcode"></i> Course Code *</label>
                    <input type="text" id="p-course-code" placeholder="e.g. CSE-BTECH" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="p-course-name"><i class="fa-solid fa-heading"></i> Course Program Name *</label>
                    <input type="text" id="p-course-name" placeholder="e.g. B.Tech Computer Engineering" required>
                </div>
                <div class="form-group-row">
                    <div class="form-group col">
                        <label for="p-course-dept"><i class="fa-solid fa-building-columns"></i> Department *</label>
                        <select id="p-course-dept" required>
                            <option value="Computer Engineering">Computer Engineering</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Electrical Engineering">Electrical Engineering</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                        </select>
                    </div>
                    <div class="form-group col">
                        <label for="p-course-duration"><i class="fa-solid fa-clock"></i> Duration (Years)</label>
                        <input type="number" id="p-course-duration" value="4" min="1" max="6" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="btn-cancel-page-course-modal">Cancel</button>
                    <button type="submit" class="btn btn-gold"><i class="fa-solid fa-plus"></i> Save Course Plan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    
    <script>
        let allCourses = [];

        document.addEventListener("DOMContentLoaded", async () => {
            const authOk = await checkAuth(['admin', 'teacher', 'student']);
            if (authOk) {
                document.getElementById('header-view-title').textContent = "Courses Plan";
                document.getElementById('header-view-subtitle').textContent = "Degree curriculum guidelines, durations & departments";
                
                loadCoursesPage();

                document.getElementById('btn-page-add-course').onclick = () => {
                    document.getElementById('page-course-form').reset();
                    document.getElementById('page-course-modal').classList.remove('hidden');
                };

                document.getElementById('btn-close-page-course-modal').onclick = () => {
                    document.getElementById('page-course-modal').classList.add('hidden');
                };
                document.getElementById('btn-cancel-page-course-modal').onclick = () => {
                    document.getElementById('page-course-modal').classList.add('hidden');
                };

                document.getElementById('page-course-form').onsubmit = async (e) => {
                    e.preventDefault();
                    const payload = {
                        course_code: document.getElementById('p-course-code').value.trim(),
                        course_name: document.getElementById('p-course-name').value.trim(),
                        department: document.getElementById('p-course-dept').value.trim(),
                        duration_years: parseInt(document.getElementById('p-course-duration').value || 4)
                    };

                    const res = await apiFetch('/api/courses', 'POST', payload);
                    if (res && res.success) {
                        showToast("Course Created", res.message || "Course created!", "success");
                        document.getElementById('page-course-modal').classList.add('hidden');
                        loadCoursesPage();
                    } else {
                        showToast("Error", res.message || "Failed to create course.", "error");
                    }
                };

                document.getElementById('course-page-search').oninput = (e) => {
                    const sq = e.target.value.toLowerCase().trim();
                    const filtered = allCourses.filter(c => 
                        (c.course_name && c.course_name.toLowerCase().includes(sq)) || 
                        (c.course_code && c.course_code.toLowerCase().includes(sq))
                    );
                    renderCoursesGrid(filtered);
                };
            }
        });

        async function loadCoursesPage() {
            const res = await apiFetch('/api/courses');
            if (res && res.success) {
                allCourses = res.courses || [];
                renderCoursesGrid(allCourses);
            }
        }

        function renderCoursesGrid(courses) {
            const container = document.getElementById('courses-grid-container');
            if (!container) return;

            if (!courses || courses.length === 0) {
                container.innerHTML = `
                    <div class="empty-category-notice glassmorphism" style="grid-column: 1 / -1; padding: 3rem; text-align: center; color: var(--text-muted);">
                        <i class="fa-solid fa-graduation-cap" style="font-size: 2.5rem; color: var(--accent-gold); margin-bottom: 1rem;"></i>
                        <h3>No Degree Courses Found</h3>
                    </div>
                `;
                return;
            }

            let html = '';
            courses.forEach(c => {
                html += `
                    <div class="course-card glassmorphism" style="padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; gap: 1rem;">
                        <div>
                            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                <span class="badge" style="background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); font-weight: 700;">${c.course_code}</span>
                                <span style="font-size: 0.8rem; color: var(--text-muted);"><i class="fa-solid fa-clock"></i> ${c.duration_years || 4} Years</span>
                            </div>
                            <h3 style="margin-top: 10px; font-weight: 700; font-size: 1.15rem; color: var(--text-main);">${c.course_name || c.name}</h3>
                            <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">
                                <i class="fa-solid fa-building-columns"></i> ${c.department}
                            </div>
                        </div>
                        <div style="display: flex; justify-content: flex-end; border-top: 1px solid var(--glass-border); padding-top: 0.75rem;">
                            <button class="btn btn-outline" style="font-size: 0.8rem; color: var(--danger); border-color: var(--danger);" onclick="deleteCourse('${c.course_id}')">
                                <i class="fa-solid fa-trash-can"></i> Delete
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function deleteCourse(courseId) {
            showConfirmModal("Confirm Course Deletion", "Are you sure you want to delete this course plan?", async () => {
                const res = await apiFetch(`/api/courses/${courseId}`, 'DELETE');
                if (res && res.success) {
                    showToast("Course Deleted", res.message || "Course deleted.", "success");
                    loadCoursesPage();
                } else {
                    showToast("Error", res.message || "Failed to delete course.", "error");
                }
            });
        }
    </script>
</body>
</html>

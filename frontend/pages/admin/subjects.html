<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Subjects Registry</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="dark-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation Container -->
        <aside class="sidebar glassmorphism" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header Container -->
            <header class="main-header glassmorphism" id="header-container"></header>

            <!-- Scrollable Content Body -->
            <div class="content-body">
                <section id="view-subjects" class="dashboard-view">
                    <!-- Department Categorization Cards -->
                    <div class="department-category-cards" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem;">
                        <div class="dept-cat-card glassmorphism" data-dept="Computer Engineering" style="padding: 1.25rem; display: flex; align-items: center; gap: 1rem;">
                            <div class="dept-cat-icon" style="font-size: 1.8rem; color: var(--accent-blue);"><i class="fa-solid fa-laptop-code"></i></div>
                            <div class="dept-cat-info">
                                <h4>Computer Engg</h4>
                                <span class="dept-student-count" id="count-sub-computer">0 Subjects</span>
                            </div>
                        </div>
                        <div class="dept-cat-card glassmorphism" data-dept="Information Technology" style="padding: 1.25rem; display: flex; align-items: center; gap: 1rem;">
                            <div class="dept-cat-icon" style="font-size: 1.8rem; color: var(--accent-gold);"><i class="fa-solid fa-network-wired"></i></div>
                            <div class="dept-cat-info">
                                <h4>Information Tech</h4>
                                <span class="dept-student-count" id="count-sub-it">0 Subjects</span>
                            </div>
                        </div>
                        <div class="dept-cat-card glassmorphism" data-dept="Electrical Engineering" style="padding: 1.25rem; display: flex; align-items: center; gap: 1rem;">
                            <div class="dept-cat-icon" style="font-size: 1.8rem; color: var(--success);"><i class="fa-solid fa-bolt"></i></div>
                            <div class="dept-cat-info">
                                <h4>Electrical Engg</h4>
                                <span class="dept-student-count" id="count-sub-electrical">0 Subjects</span>
                            </div>
                        </div>
                        <div class="dept-cat-card glassmorphism" data-dept="Mechanical Engineering" style="padding: 1.25rem; display: flex; align-items: center; gap: 1rem;">
                            <div class="dept-cat-icon" style="font-size: 1.8rem; color: #8b5cf6;"><i class="fa-solid fa-gears"></i></div>
                            <div class="dept-cat-info">
                                <h4>Mechanical Engg</h4>
                                <span class="dept-student-count" id="count-sub-mechanical">0 Subjects</span>
                            </div>
                        </div>
                    </div>

                    <!-- Search and Filters Bar -->
                    <div class="action-bar-row" style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: 1rem;">
                        <div class="search-box" style="display: flex; align-items: center; gap: 8px; flex: 1; max-width: 420px; background: rgba(0,0,0,0.15); border: 1px solid var(--glass-border); padding: 0.5rem 1rem; border-radius: 8px;">
                            <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
                            <input type="text" id="subject-search-input" placeholder="Search subject by title or code..." style="background: transparent; border: none; outline: none; width: 100%; color: var(--text-main);">
                        </div>
                        <div class="filters-row" style="display: flex; gap: 0.75rem;">
                            <select id="subject-dept-filter" class="form-control" style="background: rgba(0,0,0,0.15); color: var(--text-main); border: 1px solid var(--glass-border); padding: 0.5rem 1rem; border-radius: 8px; outline: none;">
                                <option value="">All Departments</option>
                                <option value="Computer Engineering">Computer Engineering</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Electrical Engineering">Electrical Engineering</option>
                                <option value="Mechanical Engineering">Mechanical Engineering</option>
                            </select>
                            <select id="subject-sem-filter" class="form-control" style="background: rgba(0,0,0,0.15); color: var(--text-main); border: 1px solid var(--glass-border); padding: 0.5rem 1rem; border-radius: 8px; outline: none;">
                                <option value="">All Semesters</option>
                                <option value="1">Semester 1</option>
                                <option value="2">Semester 2</option>
                                <option value="3">Semester 3</option>
                                <option value="4">Semester 4</option>
                                <option value="5">Semester 5</option>
                                <option value="6">Semester 6</option>
                                <option value="7">Semester 7</option>
                                <option value="8">Semester 8</option>
                            </select>
                            <button class="btn btn-outline" id="btn-open-add-course-modal" style="border-color: var(--accent-gold); color: var(--accent-gold);">
                                <i class="fa-solid fa-graduation-cap"></i> Add Degree Plan
                            </button>
                            <button class="btn btn-primary" id="btn-open-add-subject-modal">
                                <i class="fa-solid fa-plus"></i> Add Subject
                            </button>
                        </div>
                    </div>

                    <!-- Data Table Container -->
                    <div id="subjects-list-container" style="margin-top: 1rem;">
                        <div class="empty-category-notice glassmorphism" style="padding: 2rem; text-align: center; color: var(--text-muted);">
                            <i class="fa-solid fa-spinner fa-spin" style="font-size: 1.5rem; margin-bottom: 0.5rem;"></i><br>Loading subjects directory...
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- MODAL: Add Subject -->
    <div id="add-subject-modal" class="modal-wrapper hidden">
        <div class="modal-card glassmorphism">
            <div class="modal-header">
                <h3><i class="fa-solid fa-book-open" style="color: var(--accent-blue);"></i> Add New Subject Definition</h3>
                <button class="modal-close-btn" id="btn-close-subject-modal" aria-label="Close modal">&times;</button>
            </div>
            <form id="add-subject-form">
                <div class="form-group-row">
                    <div class="form-group col">
                        <label for="sub-code"><i class="fa-solid fa-barcode"></i> Subject Code (Unique) *</label>
                        <input type="text" id="sub-code" placeholder="e.g. CS101" required autocomplete="off">
                    </div>
                    <div class="form-group col">
                        <label for="sub-name"><i class="fa-solid fa-heading"></i> Subject Title *</label>
                        <input type="text" id="sub-name" placeholder="e.g. Data Structures & Algorithms" required>
                    </div>
                </div>
                <div class="form-group-row">
                    <div class="form-group col">
                        <label for="sub-dept"><i class="fa-solid fa-building-columns"></i> Department *</label>
                        <select id="sub-dept" required>
                            <option value="Computer Engineering">Computer Engineering</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Electrical Engineering">Electrical Engineering</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                        </select>
                    </div>
                    <div class="form-group col">
                        <label for="sub-course"><i class="fa-solid fa-graduation-cap"></i> Degree Course Plan</label>
                        <select id="sub-course">
                            <option value="">-- Select Course Plan --</option>
                        </select>
                    </div>
                </div>
                <div class="form-group-row">
                    <div class="form-group col">
                        <label for="sub-sem"><i class="fa-solid fa-layer-group"></i> Academic Semester</label>
                        <select id="sub-sem" required>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3" selected>Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                    </div>
                    <div class="form-group col">
                        <label for="sub-credits"><i class="fa-solid fa-star"></i> Academic Credits</label>
                        <input type="number" id="sub-credits" value="4" min="1" max="10" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="sub-faculty"><i class="fa-solid fa-chalkboard-user"></i> Assigned Faculty Member</label>
                    <select id="sub-faculty">
                        <option value="">-- No Faculty Assigned --</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="btn-cancel-subject-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Create Subject</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: Edit Subject -->
    <div id="edit-subject-modal" class="modal-wrapper hidden">
        <div class="modal-card glassmorphism">
            <div class="modal-header">
                <h3><i class="fa-solid fa-pen-to-square" style="color: var(--accent-gold);"></i> Edit Subject Details</h3>
                <button class="modal-close-btn" id="btn-close-edit-subject-modal" aria-label="Close modal">&times;</button>
            </div>
            <form id="edit-subject-form">
                <input type="hidden" id="edit-sub-id">
                <div class="form-group-row">
                    <div class="form-group col">
                        <label for="edit-sub-code"><i class="fa-solid fa-barcode"></i> Subject Code *</label>
                        <input type="text" id="edit-sub-code" required>
                    </div>
                    <div class="form-group col">
                        <label for="edit-sub-name"><i class="fa-solid fa-heading"></i> Subject Title *</label>
                        <input type="text" id="edit-sub-name" required>
                    </div>
                </div>
                <div class="form-group-row">
                    <div class="form-group col">
                        <label for="edit-sub-dept"><i class="fa-solid fa-building-columns"></i> Department *</label>
                        <select id="edit-sub-dept" required>
                            <option value="Computer Engineering">Computer Engineering</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Electrical Engineering">Electrical Engineering</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                        </select>
                    </div>
                    <div class="form-group col">
                        <label for="edit-sub-course"><i class="fa-solid fa-graduation-cap"></i> Course Plan Code</label>
                        <input type="text" id="edit-sub-course" placeholder="e.g. CSE-BTECH">
                    </div>
                </div>
                <div class="form-group-row">
                    <div class="form-group col">
                        <label for="edit-sub-sem"><i class="fa-solid fa-layer-group"></i> Semester</label>
                        <select id="edit-sub-sem" required>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                    </div>
                    <div class="form-group col">
                        <label for="edit-sub-credits"><i class="fa-solid fa-star"></i> Credits</label>
                        <input type="number" id="edit-sub-credits" min="1" max="10" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="edit-sub-faculty"><i class="fa-solid fa-chalkboard-user"></i> Assigned Faculty</label>
                    <select id="edit-sub-faculty">
                        <option value="">-- No Faculty Assigned --</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="btn-cancel-edit-subject-modal">Cancel</button>
                    <button type="submit" class="btn btn-gold"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: Assign Faculty -->
    <div id="assign-faculty-modal" class="modal-wrapper hidden">
        <div class="modal-card glassmorphism">
            <div class="modal-header">
                <h3><i class="fa-solid fa-user-check" style="color: var(--accent-gold);"></i> Assign Teacher to Subject</h3>
                <button class="modal-close-btn" id="btn-close-assign-fac-modal">&times;</button>
            </div>
            <form id="assign-faculty-form">
                <input type="hidden" id="assign-sub-id">
                <p style="margin-bottom: 1rem; font-size: 0.9rem; color: var(--text-muted);">
                    Assigning faculty instructor for <strong id="assign-sub-title" style="color: var(--text-main);">Subject</strong>:
                </p>
                <div class="form-group">
                    <label for="assign-fac-select"><i class="fa-solid fa-chalkboard-user"></i> Select Faculty Member</label>
                    <select id="assign-fac-select" class="form-control" required style="width: 100%; padding: 0.6rem; border-radius: 8px; background: rgba(0,0,0,0.2); color: var(--text-main); border: 1px solid var(--glass-border);">
                        <option value="">Loading faculty options...</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="btn-cancel-assign-fac-modal">Cancel</button>
                    <button type="submit" class="btn btn-gold"><i class="fa-solid fa-check"></i> Assign Faculty</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: Add Degree Course Plan -->
    <div id="add-course-modal" class="modal-wrapper hidden">
        <div class="modal-card glassmorphism">
            <div class="modal-header">
                <h3><i class="fa-solid fa-graduation-cap" style="color: var(--accent-gold);"></i> Add Degree Course Plan</h3>
                <button class="modal-close-btn" id="btn-close-course-modal">&times;</button>
            </div>
            <form id="add-course-form">
                <div class="form-group">
                    <label for="course-code"><i class="fa-solid fa-barcode"></i> Course Code (Unique) *</label>
                    <input type="text" id="course-code" placeholder="e.g. CSE-BTECH" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="course-name"><i class="fa-solid fa-heading"></i> Course Program Name *</label>
                    <input type="text" id="course-name" placeholder="e.g. B.Tech Computer Engineering" required>
                </div>
                <div class="form-group-row">
                    <div class="form-group col">
                        <label for="course-dept"><i class="fa-solid fa-building-columns"></i> Department *</label>
                        <select id="course-dept" required>
                            <option value="Computer Engineering">Computer Engineering</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Electrical Engineering">Electrical Engineering</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                        </select>
                    </div>
                    <div class="form-group col">
                        <label for="course-duration"><i class="fa-solid fa-clock"></i> Duration (Years)</label>
                        <input type="number" id="course-duration" value="4" min="1" max="6" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="btn-cancel-course-modal">Cancel</button>
                    <button type="submit" class="btn btn-gold"><i class="fa-solid fa-plus"></i> Create Course Plan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/subjects.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const authOk = await checkAuth(['admin', 'teacher', 'student']);
            if (authOk) {
                document.getElementById('header-view-title').textContent = "Subjects Registry";
                document.getElementById('header-view-subtitle').textContent = "Curriculum subject definitions, allocations & credit maps";
                
                loadSubjectsList();
            }
        });
    </script>
</body>
</html>

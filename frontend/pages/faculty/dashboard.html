<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Faculty Workspace</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="dark-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation Container -->
        <aside class="sidebar glassmorphism" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header Container -->
            <header class="main-header glassmorphism" id="header-container"></header>

            <!-- Scrollable Content Body -->
            <div class="content-body">
                <section class="dashboard-view flex-center" style="height: 60vh; flex-direction: column; text-align: center; gap: 1rem;">
                    <i class="fa-solid fa-chalkboard-user" style="font-size: 3.5rem; color: var(--accent-gold);"></i>
                    <h2>Faculty Portal Workspace</h2>
                    <p class="text-muted" style="max-width: 400px;">Welcome to your teaching workspace. Use the sidebar to mark class attendance registers or publish student exam marks.</p>
                    <div style="display:flex; gap:10px;">
                        <a href="/pages/admin/attendance.html" class="btn btn-primary"><i class="fa-solid fa-calendar-check"></i> Mark Attendance</a>
                        <a href="/pages/admin/examinations.html" class="btn btn-success"><i class="fa-solid fa-file-invoice"></i> Submit Marks</a>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const authOk = await checkAuth(['teacher', 'admin']);
            if (authOk) {
                document.getElementById('header-view-title').textContent = "Faculty Workspace";
                document.getElementById('header-view-subtitle').textContent = "Organize class registers & submit exam scores";
            }
        });
    </script>
</body>
</html>

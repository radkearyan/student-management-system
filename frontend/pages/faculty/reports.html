<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Academic Reports</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="dark-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation Container -->
        <aside class="sidebar glassmorphism" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header Container -->
            <header class="main-header glassmorphism" id="header-container"></header>

            <!-- Scrollable Content Body -->
            <div class="content-body">
                <section id="view-feedback" class="dashboard-view">
                    <div id="teacher-feedback-view" class="feedback-report-panel glassmorphism" style="padding: 1.5rem;">
                        <h3>Teaching-Learning Feedback Report</h3>
                        <p class="text-muted">Summary of feedback evaluations collected from students</p>
                        <div class="table-container mt-3">
                            <table class="data-table" id="feedback-report-table">
                                <thead>
                                    <tr>
                                        <th>Student ID</th>
                                        <th>Student Name</th>
                                        <th>Faculty Name</th>
                                        <th>Subject</th>
                                        <th>Q1</th>
                                        <th>Q2</th>
                                        <th>Q3</th>
                                        <th>Q4</th>
                                        <th>Q5</th>
                                        <th>Comments</th>
                                        <th>Date</th>
                                    </tr>
                                </thead>
                                <tbody id="feedback-report-body">
                                    <tr>
                                        <td colspan="11" class="text-center text-muted">No feedback records found.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const authOk = await checkAuth(['admin', 'teacher']);
            if (authOk) {
                document.getElementById('header-view-title').textContent = "Academic Feedback Logs";
                document.getElementById('header-view-subtitle').textContent = "Teaching-learning quality evaluations reports";
                
                loadFeedbackReport();
            }
        });

        async function loadFeedbackReport() {
            let res = await API.get('/api/reports/feedback');
            if (!res || !res.success) {
                res = await API.get('/api/feedback');
            }
            const body = document.getElementById('feedback-report-body');
            if (!body) return;
            body.innerHTML = '';
            
            if (res && res.success && res.feedback.length > 0) {
                res.feedback.forEach(f => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${f.student_id}</strong></td>
                        <td>${f.student_name || 'N/A'}</td>
                        <td>${f.faculty_name}</td>
                        <td>${f.subject}</td>
                        <td class="text-center">${f.q1}</td>
                        <td class="text-center">${f.q2}</td>
                        <td class="text-center">${f.q3}</td>
                        <td class="text-center">${f.q4}</td>
                        <td class="text-center">${f.q5}</td>
                        <td style="max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${f.comments || ''}">${f.comments || '-'}</td>
                        <td>${f.created_at}</td>
                    `;
                    body.appendChild(tr);
                });
            } else {
                body.innerHTML = '<tr><td colspan="11" class="text-center text-muted">No feedback records found.</td></tr>';
            }
        }
    </script>
</body>
</html>
